name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on version tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-download
          $bin = (Get-ChildItem ffmpeg-download -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "FFMPEG_BIN=$bin" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          SVT_LOG: "1"
        run: python -m pytest -q

      - name: Build standalone app
        shell: pwsh
        run: python packaging/build.py --ffmpeg-dir "$env:FFMPEG_BIN"

      - uses: actions/upload-artifact@v7
        with:
          name: QuickCut-windows-x64
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python packaging/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "QuickCut $GITHUB_REF_NAME" --notes-file notes.md
